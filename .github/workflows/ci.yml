name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out source
        # v7.0.1; v4 runs on Node 20, which GitHub-hosted runners no longer support.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Bootstrap checksummed Zig
        id: zig
        env:
          CGZ_TOOLCHAIN_CACHE: ${{ runner.temp }}/coordgen-zig-toolchain
        run: echo "zig=$(tools/bootstrap-zig)" >> "$GITHUB_OUTPUT"

      - name: Verify build and provenance policy
        env:
          CGZ_ZIG: ${{ steps.zig.outputs.zig }}
          ZIG_GLOBAL_CACHE_DIR: ${{ runner.temp }}/zig-provenance-cache
          ZIG_LOCAL_CACHE_DIR: ${{ runner.temp }}/zig-provenance-local-cache
        run: |
          tools/check-build-policy
          tools/verify-upstream

      - name: Prove ordinary builds do not fetch the oracle
        env:
          HTTP_PROXY: http://127.0.0.1:9
          HTTPS_PROXY: http://127.0.0.1:9
          ALL_PROXY: http://127.0.0.1:9
          ZIG_GLOBAL_CACHE_DIR: ${{ runner.temp }}/zig-ordinary-empty-cache
          ZIG_LOCAL_CACHE_DIR: ${{ runner.temp }}/zig-ordinary-local-cache
        run: ${{ steps.zig.outputs.zig }} build test

      - name: Fetch complete package graph
        env:
          ZIG_GLOBAL_CACHE_DIR: ${{ runner.temp }}/zig-offline-cache
          ZIG_LOCAL_CACHE_DIR: ${{ runner.temp }}/zig-offline-local-cache
        run: ${{ steps.zig.outputs.zig }} build --fetch=all

      - name: Build and validate fetched packages offline
        env:
          HTTP_PROXY: http://127.0.0.1:9
          HTTPS_PROXY: http://127.0.0.1:9
          ALL_PROXY: http://127.0.0.1:9
          ZIG_GLOBAL_CACHE_DIR: ${{ runner.temp }}/zig-offline-cache
          ZIG_LOCAL_CACHE_DIR: ${{ runner.temp }}/zig-offline-local-cache
        run: |
          ${{ steps.zig.outputs.zig }} build package-check
          ${{ steps.zig.outputs.zig }} build abi-check
          ${{ steps.zig.outputs.zig }} build abi-check -Doptimize=safe
          ${{ steps.zig.outputs.zig }} build -Denable-oracle=true upstream-oracle
          ${{ steps.zig.outputs.zig }} build -Denable-oracle=true template-regeneration-check
          ${{ steps.zig.outputs.zig }} build -Denable-oracle=true performance-baseline

      # The architecture axis of the stability classification runs the other
      # CPU architecture's binaries. macOS arm64 runners do that through
      # Rosetta. Linux needs qemu-user *and* a runtime for the foreign
      # architecture's libc: the oracle binaries are dynamically linked against
      # glibc, so without an aarch64 loader on disk they die in the loader
      # before main. qemu-user finds it through -L, which zig passes when it is
      # given --libc-runtimes; libc6-arm64-cross installs the tree it expects
      # at /usr/aarch64-linux-gnu. Keeping both halves on glibc is deliberate —
      # a musl-linked cross oracle would put a second variable (libm) inside an
      # axis that is supposed to isolate the architecture.
      #
      # qemu-user-static must NOT be installed here, and no binfmt_misc handler
      # for aarch64 may survive this step. zig reaches its qemu path only after
      # spawning the foreign binary *fails*: see lib/compiler/Maker/Step/Run.zig,
      # where the external executor is consulted in the error.InvalidExe branch.
      # A registered handler makes the spawn succeed, the kernel runs qemu
      # without the -L that zig would have supplied, and the guest dies in its
      # loader — which is exactly how this failed the first two times.
      - name: Install foreign-architecture executor
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-user libc6-arm64-cross
          test -e /usr/aarch64-linux-gnu/lib/ld-linux-aarch64.so.1
          command -v qemu-aarch64
          for handler in /proc/sys/fs/binfmt_misc/*; do
            case "${handler##*/}" in status|register|'*') continue ;; esac
            if grep -qa 'aarch64\|arm64' "$handler" 2>/dev/null; then
              echo "disabling binfmt_misc handler ${handler##*/}"
              echo -1 | sudo tee "$handler" > /dev/null
            fi
          done
          ! grep -qas 'aarch64\|arm64' /proc/sys/fs/binfmt_misc/* || {
            echo "an aarch64 binfmt_misc handler is still registered; it would bypass zig's -L" >&2
            exit 1
          }

      - name: Classify corpus stability against recorded expectations
        env:
          HTTP_PROXY: http://127.0.0.1:9
          HTTPS_PROXY: http://127.0.0.1:9
          ALL_PROXY: http://127.0.0.1:9
          ZIG_GLOBAL_CACHE_DIR: ${{ runner.temp }}/zig-offline-cache
          ZIG_LOCAL_CACHE_DIR: ${{ runner.temp }}/zig-offline-local-cache
          # -fqemu and --libc-runtimes are build-runner flags the build script
          # cannot observe; -Dforeign-executor declares the same arrangement to
          # the script so the architecture axis is not reported as unrunnable.
          QEMU_FLAGS: ${{ runner.os == 'Linux' && '-Dforeign-executor=qemu -fqemu --libc-runtimes /usr' || '' }}
        run: ${{ steps.zig.outputs.zig }} build corpus-check -Denable-oracle=true $QEMU_FLAGS

      - name: Prove installed artifacts exclude the oracle
        env:
          HTTP_PROXY: http://127.0.0.1:9
          HTTPS_PROXY: http://127.0.0.1:9
          ALL_PROXY: http://127.0.0.1:9
          # The isolation script must use the already checksummed toolchain.
          # Its fallback bootstrap is deliberately blocked by the offline
          # proxy used to prove the install has no network dependency.
          CGZ_ZIG: ${{ steps.zig.outputs.zig }}
          ZIG_GLOBAL_CACHE_DIR: ${{ runner.temp }}/zig-offline-cache
          ZIG_LOCAL_CACHE_DIR: ${{ runner.temp }}/zig-offline-local-cache
        run: |
          ${{ steps.zig.outputs.zig }} build --prefix "${{ runner.temp }}/coordgen-install"
          tools/check-install-isolation "${{ runner.temp }}/coordgen-install"
